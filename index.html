<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B4FE9" />
    <meta name="description" content="Malchingu (말친구), your Korean talking buddy: a word a day, flashcards and study guides." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <title>Malchingu</title>
    <script>
      // Apply the saved Light/Dark choice before the page draws, so it never flashes the wrong theme.
      try {
        var theme = localStorage.getItem("malchingu.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
