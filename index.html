<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B4FE9" />
    <meta name="description" content="Korimal (코리말), your Korean talking buddy: a word a day, flashcards and study guides." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://mal-chingu-web.vercel.app/" />
    <meta property="og:title" content="Korimal (코리말): Your Korean Talking Buddy" />
    <meta property="og:description" content="A word a day, flashcards and study guides built from your own notes." />
    <meta property="og:image" content="https://mal-chingu-web.vercel.app/icon-512.png" />
    <!-- Montserrat for the page's text (Hangul falls back to the system's Korean font). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" />
    <title>Korimal</title>
    <script>
      // Apply the saved Light/Dark choice before the page draws, so it never flashes the wrong theme.
      try {
        var theme = localStorage.getItem("malchingu.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
